# ===========================================================================
# Mantiene despierto el proyecto de Supabase.
#
# Los proyectos del plan gratuito se pausan tras 7 días sin actividad, y
# despausarlos es manual desde el dashboard. Esto le pega cada 2 días.
#
# HISTORIAL REAL (por qué el diseño cambió):
# El 14-sep se corrió 03_keepalive.sql y rpc/ping() escribió sin problema
# cuatro veces seguidas (15/17/19/21-sep). El 23-sep el proyecto YA ESTABA
# PAUSADO otra vez. O sea: una escritura real vía PostgREST no fue garantía de
# evitar la pausa. Pasó dos veces con enfoques distintos (401 por RLS, y luego
# un ping que sí escribía) — así que ya no se confía en nada que pase por la
# API HTTP para esto.
#
# LA DEFENSA REAL: el paso `psql` de abajo, que abre una conexión DIRECTA a
# Postgres (protocolo de base de datos, no HTTP). Es el mismo mecanismo que
# recomienda la comunidad de Supabase para esto, y lo único que no se ha usado
# todavía. Necesita el secreto SUPABASE_DB_URL:
#
#   1. Supabase → Project Settings → Database → Connection string →
#      pestaña "Session pooler" → copiar (cambiar [YOUR-PASSWORD] por tu
#      contraseña real de base de datos).
#   2. GitHub → este repo → Settings → Secrets and variables → Actions →
#      New repository secret → nombre SUPABASE_DB_URL, pegar el valor.
#
# Sin ese secreto, el paso se salta y este workflow queda como monitor nada
# más: avisa si el proyecto se cae, pero no hay evidencia de que lo prevenga.
#
# Por qué cada 2 días y no cada 6: GitHub no garantiza la hora exacta de los
# cron — bajo carga los retrasa e incluso llega a saltarse alguno. Con 2 días
# hay tres oportunidades dentro de la ventana de 7.
# ===========================================================================
name: Latido de Supabase

on:
  schedule:
    # 07:14 UTC (01:14 en CDMX) cada 2 días.
    # El minuto 14 es a propósito: en punto es cuando GitHub tiene más cola.
    # El salto más largo del año es de 3 días (29 feb → 1 mar), muy por debajo
    # de los 7 de la ventana.
    - cron: '14 7 */2 * *'
  # Permite dispararlo a mano desde la pestaña Actions para probarlo.
  workflow_dispatch:

# Escritura para el sello mensual del paso de más abajo.
permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Vacío si no creaste el secreto; el paso de psql se salta solo.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: con el clon superficial que trae por defecto,
          # el `git pull --rebase` del sello mensual falla.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lo más contundente, si configuraste el secreto: conexión directa a
      # Postgres. `psql` viene preinstalado en los runners de Ubuntu.
      - name: Conexión directa a Postgres (si hay secreto)
        if: env.SUPABASE_DB_URL != ''
        run: |
          psql "$SUPABASE_DB_URL" -Atc "select 'latido ' || now();"

      # Siempre: sondea la API y sirve además de monitor de que el proyecto
      # sigue en pie.
      - name: Ping a Supabase
        run: node tools/keepalive.mjs

      # ------------------------------------------------------------------
      # Mantener vivo al propio robot.
      #
      # GitHub apaga los workflows programados cuando el repositorio pasa 60
      # días sin actividad. En un proyecto personal eso llega solo, y el modo
      # de falla es silencioso: el robot se apaga, nadie lo nota, y a los 7
      # días Supabase pausa el proyecto. Justo lo que se quería evitar.
      #
      # Un commit el día 1 de cada mes reinicia ese contador.
      # ------------------------------------------------------------------
      - name: Sello mensual para que GitHub no apague el cron
        if: github.event_name == 'schedule'
        continue-on-error: true   # si falla, el ping ya cumplió: no marcar rojo
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Hoy no toca sello (sólo el día 1)."
            exit 0
          fi

          date -u +"Último latido verificado: %Y-%m-%d %H:%M UTC" > .github/last-keepalive.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt

          if git diff --staged --quiet; then
            echo "Sin cambios que sellar."
            exit 0
          fi

          git commit -m "Sello mensual del latido

          Commit automático. Su único fin es dar actividad al repositorio:
          GitHub apaga los workflows programados tras 60 días sin ninguna,
          y si este se apaga, Supabase acaba pausando el proyecto."

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # El ping sólo falla cuando el proyecto NO responde. GitHub ya manda
      # correo por el job en rojo; este paso deja el motivo y el remedio
      # escritos en el resumen del run, sin tener que abrir los logs.
      - name: Explicar la falla
        if: failure()
        run: |
          {
            echo "### El latido falló: el proyecto de Supabase no respondió"
            echo ""
            echo "Casi siempre significa que **el proyecto está pausado**."
            echo ""
            echo "**Ahora mismo, para volver a entrar:**"
            echo "1. Entra a https://supabase.com/dashboard"
            echo "2. Abre el proyecto y dale **Restore project** (tarda ~2 min, no pierdes nada)"
            echo ""
            echo "**Para que esto no se repita:** el sondeo por PostgREST ya"
            echo "demostró que NO evita la pausa (funcionó varios días seguidos y"
            echo "aun así se pausó). La única vía con evidencia real es una"
            echo "conexión directa a Postgres. Define el secreto"
            echo "\`SUPABASE_DB_URL\` — los pasos exactos están en el comentario"
            echo "de arriba de \`.github/workflows/keepalive.yml\` y en"
            echo "\`docs/SETUP.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
