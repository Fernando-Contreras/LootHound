# ===========================================================================
# Mantiene despierto el proyecto de Supabase.
#
# Los proyectos del plan gratuito se pausan tras 7 días sin actividad de base
# de datos, y despausarlos es manual desde el dashboard. Esto le pega cada 2
# días.
#
# Por qué cada 2 días y no cada 6:
# GitHub no garantiza la hora exacta de los cron — bajo carga los retrasa e
# incluso llega a saltarse alguno. Con 2 días hay tres oportunidades dentro de
# la ventana de 7, así que perder una no rompe nada.
#
# El script (tools/keepalive.mjs) sondea dos cosas y le basta con una:
#   - rpc/ping        → escribe en la tabla heartbeat (necesita 03_keepalive.sql)
#   - auth/v1/settings → GoTrue lee la config del proyecto desde Postgres
#
# OPCIONAL, lo más contundente: define el secreto SUPABASE_DB_URL con la cadena
# de conexión "Session pooler" (Project Settings → Database → Connection string)
# y el paso de psql abre una conexión directa a Postgres cada 2 días. Eso cuenta
# como actividad sin ninguna duda. Si no defines el secreto, ese paso se salta.
# ===========================================================================
name: Latido de Supabase

on:
  schedule:
    # 07:14 UTC (01:14 en CDMX) cada 2 días.
    # El minuto 14 es a propósito: en punto es cuando GitHub tiene más cola.
    # El salto más largo del año es de 3 días (29 feb → 1 mar), muy por debajo
    # de los 7 de la ventana.
    - cron: '14 7 */2 * *'
  # Permite dispararlo a mano desde la pestaña Actions para probarlo.
  workflow_dispatch:

# Escritura para el sello mensual del paso de más abajo.
permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Vacío si no creaste el secreto; el paso de psql se salta solo.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: con el clon superficial que trae por defecto,
          # el `git pull --rebase` del sello mensual falla.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lo más contundente, si configuraste el secreto: conexión directa a
      # Postgres. `psql` viene preinstalado en los runners de Ubuntu.
      - name: Conexión directa a Postgres (si hay secreto)
        if: env.SUPABASE_DB_URL != ''
        run: |
          psql "$SUPABASE_DB_URL" -Atc "select 'latido ' || now();"

      # Siempre: sondea la API y sirve además de monitor de que el proyecto
      # sigue en pie.
      - name: Ping a Supabase
        run: node tools/keepalive.mjs

      # ------------------------------------------------------------------
      # Mantener vivo al propio robot.
      #
      # GitHub apaga los workflows programados cuando el repositorio pasa 60
      # días sin actividad. En un proyecto personal eso llega solo, y el modo
      # de falla es silencioso: el robot se apaga, nadie lo nota, y a los 7
      # días Supabase pausa el proyecto. Justo lo que se quería evitar.
      #
      # Un commit el día 1 de cada mes reinicia ese contador.
      # ------------------------------------------------------------------
      - name: Sello mensual para que GitHub no apague el cron
        if: github.event_name == 'schedule'
        continue-on-error: true   # si falla, el ping ya cumplió: no marcar rojo
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Hoy no toca sello (sólo el día 1)."
            exit 0
          fi

          date -u +"Último latido verificado: %Y-%m-%d %H:%M UTC" > .github/last-keepalive.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt

          if git diff --staged --quiet; then
            echo "Sin cambios que sellar."
            exit 0
          fi

          git commit -m "Sello mensual del latido

          Commit automático. Su único fin es dar actividad al repositorio:
          GitHub apaga los workflows programados tras 60 días sin ninguna,
          y si este se apaga, Supabase acaba pausando el proyecto."

          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # El ping sólo falla cuando el proyecto NO responde. GitHub ya manda
      # correo por el job en rojo; este paso deja el motivo y el remedio
      # escritos en el resumen del run, sin tener que abrir los logs.
      - name: Explicar la falla
        if: failure()
        run: |
          {
            echo "### El latido falló: el proyecto de Supabase no respondió"
            echo ""
            echo "Casi siempre significa que **el proyecto está pausado**."
            echo ""
            echo "**Qué hacer ahora:**"
            echo "1. Entra a https://supabase.com/dashboard"
            echo "2. Abre el proyecto y dale **Restore project** (tarda ~2 min, no pierdes nada)"
            echo "3. Corre \`supabase/03_keepalive.sql\` en el SQL Editor si aún no lo has hecho"
            echo ""
            echo "Si esto se repite, define el secreto \`SUPABASE_DB_URL\` (ver el"
            echo "comentario en \`.github/workflows/keepalive.yml\`) para un latido"
            echo "por conexión directa a Postgres, que es a prueba de fallos."
          } >> "$GITHUB_STEP_SUMMARY"
