# ===========================================================================
# Mantiene despierto el proyecto de Supabase.
#
# Los proyectos del plan gratuito se pausan tras 7 días sin actividad, y
# despausarlos es manual desde el dashboard. Esto le pega cada 2 días.
#
# Por qué cada 2 días y no cada 6:
# GitHub no garantiza la hora exacta de los cron — bajo carga los retrasa e
# incluso llega a saltarse alguno. Con 2 días hay tres oportunidades dentro de
# la ventana de 7, así que perder una no rompe nada.
#
# No usa secretos: la llave publicable ya está en el repo a propósito y sin
# sesión no da acceso a nada. Lo verifica tools/check-rls.mjs.
# ===========================================================================
name: Latido de Supabase

on:
  schedule:
    # 07:14 UTC (01:14 en CDMX) los días impares del mes: 1, 3, 5... 31.
    # El minuto 14 es a propósito: en punto es cuando GitHub tiene más cola.
    # El salto más largo del año es de 3 días (29 de febrero → 1 de marzo),
    # muy por debajo de los 7 de la ventana.
    - cron: '14 7 */2 * *'
  # Permite dispararlo a mano desde la pestaña Actions para probarlo.
  workflow_dispatch:

# Escritura para el sello mensual del paso de abajo.
permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: con el clon superficial que trae por defecto,
          # el `git pull --rebase` del sello mensual falla.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ping a Supabase
        run: node tools/keepalive.mjs

      # ------------------------------------------------------------------
      # Mantener vivo al propio robot.
      #
      # GitHub apaga los workflows programados cuando el repositorio pasa 60
      # días sin actividad. En un proyecto personal eso llega solo, y el modo
      # de falla es silencioso: el robot se apaga, nadie lo nota, y a los 7
      # días Supabase pausa el proyecto. Justo lo que se quería evitar.
      #
      # Un commit al mes reinicia ese contador. Doce al año no ensucian el
      # historial, y llevan escrito para qué son.
      # ------------------------------------------------------------------
      - name: Sello mensual para que GitHub no apague el cron
        if: github.event_name == 'schedule'
        continue-on-error: true   # si falla, el ping ya cumplió: no marcar rojo
        run: |
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Hoy no toca sello (sólo el día 1)."
            exit 0
          fi

          date -u +"Último latido verificado: %Y-%m-%d %H:%M UTC" > .github/last-keepalive.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt

          if git diff --staged --quiet; then
            echo "Sin cambios que sellar."
            exit 0
          fi

          git commit -m "Sello mensual del latido

          Commit automático. Su único fin es dar actividad al repositorio:
          GitHub apaga los workflows programados tras 60 días sin ninguna,
          y si este se apaga, Supabase acaba pausando el proyecto."

          # Otro push pudo entrar mientras corría el ping.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Si el ping falla, GitHub manda correo por el job fallido. Este paso
      # sólo deja el motivo escrito en el resumen del run, para no tener que
      # abrir los registros.
      - name: Explicar la falla
        if: failure()
        run: |
          {
            echo "### El latido falló"
            echo ""
            echo "El proyecto de Supabase puede pausarse si esto sigue fallando 7 días."
            echo ""
            echo "Qué revisar:"
            echo "- ¿Ya corriste \`supabase/03_keepalive.sql\` en el SQL Editor?"
            echo "- ¿El proyecto ya está pausado? Despiértalo desde el dashboard."
            echo "- ¿Cambió la URL o la llave en \`js/config.js\`?"
          } >> "$GITHUB_STEP_SUMMARY"
